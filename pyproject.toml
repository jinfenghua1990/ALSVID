[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alsvid"
version = "0.1.0"
description = "Standalone operating platform for the ALSVID bicycle business"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.120,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.7,<3.0",
  "email-validator>=2.2,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "httpx>=0.28,<1.0",
  "boto3>=1.35,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/alsvid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["alsvid"]
