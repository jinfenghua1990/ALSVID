name: Portal login browser checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/app/login/**'
      - 'apps/web/app/[locale]/login/**'
      - 'apps/web/app/_components/portal-login*'
      - 'apps/web/app/_lib/i18n/**'
      - 'scripts/portal-login-browser-smoke.mjs'
      - '.github/workflows/portal-login-preview.yml'

permissions:
  contents: read

concurrency:
  group: portal-login-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @alsvid/web build
        env:
          ALSVID_ENV: production
      - name: Start isolated web preview
        run: |
          pnpm --filter @alsvid/web start > /tmp/portal-login-web.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/en/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/portal-login-web.log
          exit 1
        env:
          ALSVID_ENV: production
      - name: Install browser in disposable runner only
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - run: node scripts/portal-login-browser-smoke.mjs
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portal-login-browser-artifacts
          path: |
            /tmp/portal-login-artifacts
            /tmp/portal-login-web.log
