name: ALSVID Test Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm -r typecheck

      - name: Build Docker images
        run: docker compose -f infra/docker-compose.test.yml build

      - name: Start Test infrastructure
        run: docker compose -f infra/docker-compose.test.yml up -d postgres minio

      - name: Run Test database migrations
        run: docker compose -f infra/docker-compose.test.yml run --rm api pnpm db:migrate

      - name: Start Test applications
        run: docker compose -f infra/docker-compose.test.yml up -d web api worker

      - name: Smoke test API and Web
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4001/api/health >/dev/null; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "API health check did not become ready" >&2
              exit 1
            fi
            sleep 2
          done

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/ >/dev/null; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "Web smoke check did not become ready" >&2
              exit 1
            fi
            sleep 2
          done

      - name: Show Test container state
        if: always()
        run: docker compose -f infra/docker-compose.test.yml ps

      - name: Show Test logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.test.yml logs --no-color

      - name: Tear down Test environment
        if: always()
        run: docker compose -f infra/docker-compose.test.yml down -v --remove-orphans
