name: ALSVID Development Build

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  development-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Architecture check
        run: pnpm arch:check

      - name: Type check
        run: pnpm -r typecheck

      - name: Build Development Docker images
        run: docker compose -f infra/docker-compose.test.yml build

      - name: Start Development PostgreSQL
        run: docker compose -f infra/docker-compose.test.yml up -d postgres

      - name: Run Development database migrations
        run: docker compose -f infra/docker-compose.test.yml run --rm api pnpm db:migrate

      - name: Start Development applications
        run: docker compose -f infra/docker-compose.test.yml up -d web api worker gateway

      - name: Smoke check Development API and Web
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "API health check did not become ready" >&2
              exit 1
            fi
            sleep 2
          done

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "Web smoke check did not become ready" >&2
              exit 1
            fi
            sleep 2
          done

          if ! curl --fail --silent http://127.0.0.1:8080/login >/dev/null; then
            echo "Login page failed smoke check" >&2
            exit 1
          fi

          portal_response="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/portal-launcher)"
          portal_headers="$(curl --silent --show-error --dump-header - --output /dev/null http://127.0.0.1:8080/portal-launcher | tr -d '\r' | sed -E 's#^(location:) https?://[^/]+(/)$#\1 \2#I')"
          if [[ "$portal_response" != "307" ]] || ! grep -Eiq '^location: /$' <<< "$portal_headers"; then
            echo "Expected /portal-launcher compatibility redirect to /, got HTTP $portal_response" >&2
            echo "$portal_headers" >&2
            exit 1
          fi

          for route in /admin /dealer /my; do
            response="$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:8080$route")"
            headers="$(curl --silent --show-error --dump-header - --output /dev/null "http://127.0.0.1:8080$route" | tr -d '\r' | sed -E 's#^(location:) https?://[^/]+(/login(?:\?.*)?)$#\1 /login#I')"
            if [[ "$response" != "307" ]] || ! grep -Eiq '^location: /login$' <<< "$headers"; then
              echo "Expected unauthenticated $route to redirect to /login, got HTTP $response" >&2
              echo "$headers" >&2
              exit 1
            fi
          done

      - name: Show Development container state
        if: always()
        run: docker compose -f infra/docker-compose.test.yml ps

      - name: Show Development logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.test.yml logs --no-color

      - name: Tear down Development containers
        if: always()
        run: docker compose -f infra/docker-compose.test.yml down -v --remove-orphans
 <<< "$headers"; then
              echo "Expected unauthenticated $route to redirect to /login, got HTTP $response" >&2
              echo "$headers" >&2
              exit 1
            fi
          done

      - name: Show Development container state
        if: always()
        run: docker compose -f infra/docker-compose.test.yml ps

      - name: Show Development logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.test.yml logs --no-color

      - name: Tear down Development containers
        if: always()
        run: docker compose -f infra/docker-compose.test.yml down -v --remove-orphans
