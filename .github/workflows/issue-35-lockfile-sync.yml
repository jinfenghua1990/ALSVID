name: Issue 35 Lockfile Sync

on:
  push:
    branches:
      - integrations/issue-35-production-adapters
    paths:
      - packages/provider-adapters/package.json
      - .github/workflows/issue-35-lockfile-sync.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: integrations/issue-35-production-adapters
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore: sync lockfile for provider adapters'
          git push origin HEAD:integrations/issue-35-production-adapters
