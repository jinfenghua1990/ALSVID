name: Import approved commerce sources
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/commerce-source-import.yml'
      - 'scripts/commerce-lab/import-sources.mjs'
permissions:
  contents: read
concurrency:
  group: commerce-source-import-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  import:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/crmeb-native-validation' &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check whether import is already recorded
        id: scope
        shell: bash
        run: |
          if [[ -f docs/COMMERCE_SOURCE_LOCK.json ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Read fixed CRMEB source without running upstream scripts
        if: steps.scope.outputs.needed == 'true'
        uses: actions/checkout@v7
        with:
          repository: crmeb/CRMEB
          ref: da8d3b93400f3c660aa54d38b54ada387c963cd9
          path: .tmp/import-crmeb
          persist-credentials: false
      - name: Read fixed Medusa DTC source without running upstream scripts
        if: steps.scope.outputs.needed == 'true'
        uses: actions/checkout@v7
        with:
          repository: medusajs/dtc-starter
          ref: 204130a32d80b704ab509069dcc1a2f8a61f51c1
          path: .tmp/import-medusa-dtc
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.needed == 'true'
        with:
          node-version: 22
      - name: Copy source, preserve licenses and append to this task branch
        if: steps.scope.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          SOURCE_BRANCH: feat/crmeb-native-validation
          REPO_NAME: ${{ github.repository }}
        run: node scripts/commerce-lab/import-sources.mjs
