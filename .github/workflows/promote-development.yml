name: ALSVID Promote Development to Production

on:
  workflow_run:
    workflows: ["ALSVID Development Deploy"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Optional tested develop commit SHA to promote"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: alsvid-development-production-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'develop' &&
          github.event.workflow_run.event == 'push'
        )
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release controller
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve tested Development release
        id: release
        shell: bash
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          release_sha="${INPUT_RELEASE_SHA:-${WORKFLOW_RUN_SHA:-}}"
          if [[ -z "$release_sha" ]]; then
            echo "No tested Development release SHA was supplied" >&2
            exit 1
          fi

          git fetch origin main develop
          if ! git cat-file -e "${release_sha}^{commit}" 2>/dev/null; then
            echo "Unknown release commit: $release_sha" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$release_sha" origin/develop; then
            echo "Refusing promotion: $release_sha is not part of develop" >&2
            exit 1
          fi

          # Production promotion uses merge commits so the tested Development commit
          # remains in main's ancestry. On later releases, main itself is not
          # necessarily an ancestor of develop, even though its source tree is.
          # Accept that topology only when the current production tree is exactly the
          # tree at the common ancestor. Any independent content change on main makes
          # these trees differ and blocks promotion until develop incorporates it.
          merge_base="$(git merge-base origin/main "$release_sha")"
          merge_base_tree="$(git rev-parse "${merge_base}^{tree}")"
          main_tree="$(git rev-parse 'origin/main^{tree}')"
          if [[ "$merge_base_tree" != "$main_tree" ]]; then
            echo "Refusing promotion: main contains source changes not present in the tested Development history" >&2
            exit 1
          fi

          release_tree="$(git rev-parse "${release_sha}^{tree}")"
          short_sha="${release_sha:0:12}"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "tree=$release_tree" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          if [[ "$release_tree" == "$main_tree" ]]; then
            echo "needs_promotion=false" >> "$GITHUB_OUTPUT"
            main_sha="$(git rev-parse origin/main)"
            echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
            echo "Production main already has the tested source tree; it will still be redeployed from this accepted release."
          else
            echo "needs_promotion=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Promote the exact tested tree into main
        id: promote
        if: ${{ steps.release.outputs.needs_promotion == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_TREE: ${{ steps.release.outputs.tree }}
          SHORT_SHA: ${{ steps.release.outputs.short_sha }}
        run: |
          set -euo pipefail
          # Merge the exact tested commit directly through GitHub's merge API.
          # Avoid creating an ephemeral bot PR: those produce failed PR workflow
          # records with zero jobs when merged/deleted immediately.
          # The API respects repository branch protection; never bypass it.
          gh api --method POST "repos/${GITHUB_REPOSITORY}/merges" \
            -f base=main \
            -f head="$RELEASE_SHA" \
            -f commit_message="release: promote tested Development ${SHORT_SHA}" \
            > /tmp/alsvid-promotion-merge.json

          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          main_tree="$(git rev-parse 'origin/main^{tree}')"
          if [[ "$main_tree" != "$RELEASE_TREE" ]]; then
            echo "Refusing Production dispatch: promoted main tree differs from tested Development tree" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$RELEASE_SHA" "$main_sha"; then
            echo "Refusing Production dispatch: tested Development commit is not preserved in promoted main history" >&2
            exit 1
          fi

          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "Promoted tested Development $RELEASE_SHA to main $main_sha"

      - name: Dispatch Production deployment
        if: ${{ steps.release.outputs.needs_promotion == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: ${{ steps.promote.outputs.main_sha }}
        run: |
          set -euo pipefail
          gh workflow run production-deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_sha="$MAIN_SHA" \
            -f confirm=deploy

          {
            echo "### ALSVID automatic release promotion"
            echo "- Development release: ${{ steps.release.outputs.sha }}"
            echo "- Production main release: $MAIN_SHA"
            echo "- Production deployment: dispatched"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy an already-merged tested tree if Production has not deployed it
        if: ${{ steps.release.outputs.needs_promotion == 'false' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TREE: ${{ steps.release.outputs.tree }}
        run: |
          set -euo pipefail
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          main_tree="$(git rev-parse 'origin/main^{tree}')"
          if [[ "$main_tree" != "$RELEASE_TREE" ]]; then
            echo "Refusing Production dispatch: main no longer matches the tested Development tree" >&2
            exit 1
          fi

          # A matching Git tree proves identical source, not that Cloud Run
          # deployed it. This can happen when an emergency main change is later
          # merged back into develop and accepted there.
          successful_push="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/production-deploy.yml/runs?head_sha=${main_sha}&event=push&status=success&per_page=1" --jq '.total_count')"
          if [[ "$successful_push" -gt 0 ]]; then
            echo "Production already has a successful main-push deployment for $main_sha"
          else
            gh workflow run production-deploy.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f release_sha="$main_sha" \
              -f confirm=deploy
            echo "Dispatched Production for already-merged tested main $main_sha"
          fi

          {
            echo "### ALSVID automatic release promotion"
            echo "- Development release: ${{ steps.release.outputs.sha }}"
            echo "- Production main release: $main_sha"
            echo "- Production deployment: verified prior main-push success or dispatched"
          } >> "$GITHUB_STEP_SUMMARY"
