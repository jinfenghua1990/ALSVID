name: ALSVID Promote Development to Production

# Solo developer release flow:
# develop -> development environment -> manual confirmation -> main -> production
# Automatic promotion is intentionally disabled.

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Optional tested develop commit SHA to release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote tested develop commit to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin develop main
          release_sha="${{ inputs.release_sha }}"

          if ! git merge-base --is-ancestor "$release_sha" origin/develop; then
            echo "Release commit must come from develop"
            exit 1
          fi

          git checkout main
          git merge --no-ff "$release_sha" -m "release: promote tested development ${release_sha}"
          git push origin main

          echo "Released $release_sha to main"
