name: CRMEB native acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/commerce-lab/**'
      - 'infra/commerce-lab/**'
      - 'apps/web/app/_experiments/commerce-lab/**'
      - 'external/crmeb/**'
      - '.github/workflows/crmeb-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crmeb-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0', '8.4']
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: ci-root-disposable
          MYSQL_DATABASE: crmeb_native_ci
          MYSQL_USER: crmeb_ci
          MYSQL_PASSWORD: ci-only-disposable-password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CRMEB_NATIVE_CI: disposable
      MYSQL_VERSION: ${{ matrix.mysql }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Use CRMEB source imported into this repository
        shell: bash
        run: |
          mkdir -p .tmp/crmeb-upstream
          cp -a external/crmeb/. .tmp/crmeb-upstream/
      - name: Set up native PHP runtime
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '7.4'
          extensions: mysqli, pdo_mysql, bcmath, mbstring, curl, gd, zip, redis, fileinfo
          coverage: none
          tools: none
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Initialize only the disposable native database
        run: php scripts/commerce-lab/native-bootstrap.php
      - name: Start native HTTP service and verify adapter against actual CRMEB
        env:
          APP_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:18080 -t .tmp/crmeb-upstream/crmeb/public .tmp/crmeb-upstream/crmeb/public/router.php > "$RUNNER_TEMP/crmeb-native.log" 2>&1 &
          native_pid=$!
          trap 'kill "$native_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/api/products?page=1 > /dev/null; then break; fi
            if [[ "$attempt" == "30" ]]; then exit 1; fi
            sleep 2
          done
          node scripts/commerce-lab/native-check.mjs
      - name: Build the candidate native PHP and Nginx containers
        shell: bash
        run: |
          set -euo pipefail
          cat > .tmp/crmeb-upstream/.dockerignore <<'IGNORE'
          **
          !crmeb/
          !crmeb/**
          !LICENSE
          crmeb/.env
          crmeb/.constant
          crmeb/runtime
          crmeb/backup
          crmeb/public/uploads
          crmeb/public/install.lock
          IGNORE
          docker buildx build --load --build-context deployment=infra/commerce-lab \
            -f infra/commerce-lab/Dockerfile -t alsvid-crmeb-runtime-ci .tmp/crmeb-upstream
          docker buildx build --load --build-context deployment=infra/commerce-lab \
            -f infra/commerce-lab/Dockerfile.nginx -t alsvid-crmeb-nginx-ci .tmp/crmeb-upstream
      - name: Verify packaged native runtime
        env:
          APP_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker exec -e MYSQL_PWD=ci-root-disposable "${{ job.services.mysql.id }}" mysql -uroot -e \
            "CREATE DATABASE crmeb_comparison CHARACTER SET utf8mb4; GRANT ALL ON crmeb_comparison.* TO 'crmeb_ci'@'%';"
          docker run --rm --network host --entrypoint php \
            -e 'CRMEB_DB_DSN=mysql:host=127.0.0.1;port=3307;dbname=crmeb_comparison;charset=utf8mb4' \
            -e CRMEB_DB_USER=crmeb_ci \
            -e CRMEB_DB_PASSWORD=ci-only-disposable-password \
            -e CRMEB_INIT_CONFIRM=initialize-new-crmeb-comparison \
            -e CRMEB_INITIAL_ADMIN_PASSWORD=ci-only-initial-admin-password-123456 \
            alsvid-crmeb-runtime-ci /var/alsvid-runtime/init-crmeb.php
          # Public CI-only values, never reused by any deployed service.
          docker run -d --name alsvid-crmeb-runtime-ci --network host \
            -e 'CRMEB_DB_DSN=mysql:host=127.0.0.1;port=3307;dbname=crmeb_comparison;charset=utf8mb4' \
            -e CRMEB_DB_USER=crmeb_ci \
            -e CRMEB_DB_PASSWORD=ci-only-disposable-password \
            -e CRMEB_APP_KEY=ci-only-application-key-not-a-live-secret \
            alsvid-crmeb-runtime-ci
          trap 'docker rm -f alsvid-crmeb-runtime-ci alsvid-crmeb-nginx-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name alsvid-crmeb-nginx-ci --network host alsvid-crmeb-nginx-ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/api/products?page=1 > /dev/null; then break; fi
            if [[ "$attempt" == "30" ]]; then docker logs alsvid-crmeb-runtime-ci; exit 1; fi
            sleep 2
          done
          node scripts/commerce-lab/container-check.mjs
      - name: Upload sanitized native evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: crmeb-native-evidence-mysql-${{ matrix.mysql }}
          path: .tmp/crmeb-native-evidence
          retention-days: 14
          if-no-files-found: warn
      - name: Native error diagnostics
        if: failure()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/crmeb-native.log" ]]; then
            tail -n 80 "$RUNNER_TEMP/crmeb-native.log"
          fi
