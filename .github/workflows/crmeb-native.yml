name: CRMEB native acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/commerce-lab/**'
      - 'apps/web/app/_experiments/commerce-lab/**'
      - '.github/workflows/crmeb-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crmeb-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-disposable
          MYSQL_DATABASE: crmeb_native_ci
          MYSQL_USER: crmeb_ci
          MYSQL_PASSWORD: ci-only-disposable
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      CRMEB_NATIVE_CI: disposable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out fixed native CRMEB source and bundled dependencies
        uses: actions/checkout@v7
        with:
          repository: crmeb/CRMEB
          ref: da8d3b93400f3c660aa54d38b54ada387c963cd9
          path: .tmp/crmeb-upstream
          persist-credentials: false
      - name: Set up native PHP runtime
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '7.4'
          extensions: mysqli, pdo_mysql, bcmath, mbstring, curl, gd, zip, redis, fileinfo
          coverage: none
          tools: none
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Initialize only the disposable native database
        run: php scripts/commerce-lab/native-bootstrap.php
      - name: Start native HTTP service and verify adapter against actual CRMEB
        env:
          APP_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:18080 -t .tmp/crmeb-upstream/crmeb/public .tmp/crmeb-upstream/crmeb/public/router.php > "$RUNNER_TEMP/crmeb-native.log" 2>&1 &
          native_pid=$!
          trap 'kill "$native_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/api/products?page=1 > /dev/null; then break; fi
            if [[ "$attempt" == "30" ]]; then exit 1; fi
            sleep 2
          done
          node scripts/commerce-lab/native-check.mjs
      - name: Upload sanitized native evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: crmeb-native-evidence
          path: .tmp/crmeb-native-evidence
          retention-days: 14
          if-no-files-found: warn
      - name: Native error diagnostics
        if: failure()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/crmeb-native.log" ]]; then
            tail -n 80 "$RUNNER_TEMP/crmeb-native.log"
          fi
