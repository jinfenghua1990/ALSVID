name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  verify:
    # The release PR already carries a tested develop tree; avoid duplicate checks
    # on its short-lived bot-created branch (which is deleted immediately on merge).
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'release/development-') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: alsvid
          POSTGRES_PASSWORD: alsvid
          POSTGRES_DB: alsvid
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U alsvid -d alsvid"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://alsvid:alsvid@localhost:5432/alsvid
      NODE_ENV: test
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - name: Validate Google Cloud bootstrap shell syntax
        run: |
          bash -n infra/gcp/bootstrap-development.sh
          bash -n infra/gcp/bootstrap-production.sh
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: node --test scripts/macos-test-auto-update.test.mjs
      - run: node --test scripts/release-gate.test.mjs
      - run: pnpm db:migrate
      - run: pnpm db:migrate
      - run: pnpm arch:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
