name: PR Auto Merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-merge-main
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # No checkout: this privileged controller never executes PR code.
      - name: Merge a ready same-repository PR after required CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          # GitHub's workflow_run event can arrive before the jobs API is
          # fully consistent. Retry transiently missing/in-progress job records,
          # but fail immediately if either required check has failed.
          required_checks_ready=false
          for attempt in {1..12}; do
            jobs="$(gh api "repos/$GH_REPO/actions/runs/$CI_RUN_ID/jobs?per_page=100")"
            if jq -e '[.jobs[] | select(.name == "verify" or .name == "containers") | select(.status == "completed" and .conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")] | length > 0' <<< "$jobs" >/dev/null; then
              echo 'A required CI job failed or was cancelled; refusing to merge.' >&2
              exit 1
            fi
            if jq -e '[.jobs[] | select((.name == "verify" or .name == "containers") and .status == "completed" and .conclusion == "success") | .name] | unique | sort == ["containers", "verify"]' <<< "$jobs" >/dev/null; then
              required_checks_ready=true
              break
            fi
            echo "Waiting for required CI job records to become available (attempt $attempt/12)."
            sleep 5
          done
          if [[ "$required_checks_ready" != "true" ]]; then
            echo 'Both required CI jobs did not become successful in time; refusing to merge.' >&2
            exit 1
          fi
          prs="$(gh api "repos/$GH_REPO/pulls?state=open&base=main&per_page=100")"
          number="$(jq -r --arg sha "$CI_HEAD_SHA" '.[] | select(.head.sha == $sha and .draft == false) | .number' <<< "$prs" | head -n 1)"
          if [[ -z "$number" ]]; then
            echo 'No ready trusted PR matches this CI commit.'
            exit 0
          fi
          # The main CI gate alone is not sufficient for changed WWW routes.
          # Browser workflows have their own path filters and finish after CI.
          # Wait for matching, SUCCESSFUL checks before enabling any auto merge.
          files="$(gh api --paginate "repos/$GH_REPO/pulls/$number/files?per_page=100" --jq '.[].filename')"
          need_fc1=false
          need_portal=false
          while IFS= read -r path; do
            case "$path" in
              apps/web/*|scripts/fc1-browser-review.mjs|scripts/official-browser-smoke.mjs|scripts/l8-browser-smoke.mjs|scripts/new-products-browser-smoke.mjs|scripts/dealer-browser-smoke.mjs|.github/workflows/fc1-preview.yml)
                need_fc1=true ;;
            esac
            case "$path" in
              apps/web/app/login/*|apps/web/app/\\[locale\\]/login/*|apps/web/app/_components/portal-login*|apps/web/app/reset-password/*|apps/web/app/_lib/i18n/*|scripts/portal-login-browser-smoke.mjs|.github/workflows/portal-login-preview.yml)
                need_portal=true ;;
            esac
          done <<< "$files"

          check_browser_workflow() {
            local workflow_name="$1"
            local current_run status conclusion
            for attempt in {1..90}; do
              current_run="$(gh api "repos/$GH_REPO/actions/runs?head_sha=$CI_HEAD_SHA&per_page=100" |
                jq -c --arg name "$workflow_name" --arg sha "$CI_HEAD_SHA" \
                  '[.workflow_runs[] | select(.name == $name and .head_sha == $sha and .event == "pull_request")] |
                    sort_by(.created_at) | last // empty')"
              if [[ -n "$current_run" ]]; then
                status="$(jq -r .status <<< "$current_run")"
                conclusion="$(jq -r '.conclusion // ""' <<< "$current_run")"
                if [[ "$status" == "completed" ]]; then
                  if [[ "$conclusion" == "success" ]]; then
                    echo "$workflow_name passed for $CI_HEAD_SHA."
                    return 0
                  fi
                  echo "$workflow_name did not pass ($conclusion); refusing merge." >&2
                  return 1
                fi
              fi
              echo "Waiting for $workflow_name review of $CI_HEAD_SHA ($attempt/90)"
              sleep 15
            done
            echo "$workflow_name never produced a successful run; refusing merge." >&2
            return 1
          }

          if [[ "$need_fc1" == true ]]; then
            check_browser_workflow 'FC1 browser preview'
          fi
          if [[ "$need_portal" == true ]]; then
            check_browser_workflow 'Portal login browser checks'
          fi

          # Guard again after browser tests: never merge if the PR changed since CI.
          current_head="$(gh api "repos/$GH_REPO/pulls/$number" --jq .head.sha)"
          if [[ "$current_head" != "$CI_HEAD_SHA" ]]; then
            echo 'PR head changed while browser checks ran; waiting for its own CI.' >&2
            exit 1
          fi
          gh pr merge "$number" --squash --auto --match-head-commit "$CI_HEAD_SHA"
          merged_sha=''
          for attempt in {1..12}; do
            merged_sha="$(gh api "repos/$GH_REPO/pulls/$number" --jq 'if .merged then .merge_commit_sha else "" end')"
            [[ -n "$merged_sha" ]] && break
            sleep 5
          done
          if [[ -z "$merged_sha" ]]; then
            echo 'Auto-merge enabled; another branch requirement is still blocking the PR.' >&2
            exit 1
          fi
          main_sha="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          if [[ "$main_sha" != "$merged_sha" ]]; then
            echo 'A newer main commit exists; do not dispatch CI for an obsolete release.'
            exit 0
          fi
          # GITHUB_TOKEN merges do not trigger push workflows. Explicitly run
          # main CI with Production dispatch enabled; its gated final job deploys.
          gh workflow run ci.yml --ref main -f deploy_production=true
          echo "PR #$number merged; main CI dispatched for $merged_sha." >> "$GITHUB_STEP_SUMMARY"
