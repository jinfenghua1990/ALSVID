name: ALSVID Development Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Optional commit SHA to deploy from develop"
        required: false
        type: string
      publish_only:
        description: "Only build and publish GHCR images; skip Cloud Run changes"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  packages: write
  id-token: write

concurrency:
  group: alsvid-development-deploy
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: alsvid-dev
  GCP_REGION: europe-west1
  GHCR_REGISTRY: ghcr.io/${{ github.repository_owner }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/737930071497/locations/global/workloadIdentityPools/github/providers/alsvid-development
  GCP_DEPLOY_SERVICE_ACCOUNT: alsvid-github-deploy@alsvid-dev.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: alsvid-runtime@alsvid-dev.iam.gserviceaccount.com
  R2_ENDPOINT: https://6023c5c1a7870ab69144389d71bca0a8.r2.cloudflarestorage.com
  R2_BUCKET: alsvid-development
  WEB_SERVICE: alsvid-web
  API_SERVICE: alsvid-api
  MIGRATION_JOB: alsvid-migrate

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout development release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha || (github.event_name == 'push' && github.sha) || 'develop' }}
          fetch-depth: 0

      - name: Resolve release image registry
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          git fetch origin main develop
          git merge-base --is-ancestor "$release_sha" origin/develop
          registry="${GHCR_REGISTRY}"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require CI and container acceptance before Development deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-gate.mjs checks

      - name: Build immutable development images
        env:
          REGISTRY: ${{ steps.release.outputs.registry }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --build-arg ALSVID_ENV=development -f infra/docker/Dockerfile.web -t "$REGISTRY/alsvid-dev-web:$RELEASE_SHA" .
          docker build --platform linux/amd64 -f infra/docker/Dockerfile.api -t "$REGISTRY/alsvid-dev-api:$RELEASE_SHA" .

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Ensure Development runtime can read mail secret
        if: ${{ !inputs.publish_only }}
        run: |
          set -euo pipefail
          gcloud secrets add-iam-policy-binding alsvid-mail-api-key \
            --project "$GCP_PROJECT_ID" \
            --member "serviceAccount:${GCP_RUNTIME_SERVICE_ACCOUNT}" \
            --role roles/secretmanager.secretAccessor \
            --quiet

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push development images
        env:
          REGISTRY: ${{ steps.release.outputs.registry }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          docker push "$REGISTRY/alsvid-dev-web:$RELEASE_SHA"
          docker push "$REGISTRY/alsvid-dev-api:$RELEASE_SHA"

      - name: Run Development database migrations
        if: ${{ !inputs.publish_only }}
        env:
          REGISTRY: ${{ steps.release.outputs.registry }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$MIGRATION_JOB" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$REGISTRY/alsvid-dev-api:$RELEASE_SHA" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --command pnpm \
            --args db:migrate \
            --set-env-vars NODE_ENV=test \
            --set-secrets DATABASE_URL=alsvid-database-url:latest \
            --max-retries 1 \
            --task-timeout 10m \
            --quiet
          gcloud run jobs execute "$MIGRATION_JOB" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --wait --quiet

      - name: Deploy Development API
        if: ${{ !inputs.publish_only }}
        env:
          REGISTRY: ${{ steps.release.outputs.registry }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          web_url="$(gcloud run services describe "$WEB_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          if [[ -z "$web_url" ]]; then
            echo "Development web service URL is unavailable; refusing to deploy reset links without a destination" >&2
            exit 1
          fi
          gcloud run deploy "$API_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$REGISTRY/alsvid-dev-api:$RELEASE_SHA" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --port 4000 --cpu 1 --memory 512Mi --min 0 --max 2 \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=test,ALSVID_ENV=development,ALSVID_INTERNAL_EMAIL_DOMAINS=development.alsvid.invalid,ALSVID_INTERNAL_REGISTRATION_MODE=company_domain,ALSVID_INITIAL_ADMIN_EMAIL=jinfenghua1990@gmail.com,ALSVID_EMAIL_TEST_MODE=true,MAIL_PROVIDER=resend,MAIL_FROM_ADDRESS=noreply@chaibenn.com,MAIL_FROM_NAME=ALSVID,ALSVID_PUBLIC_WEB_URL=${web_url},OBJECT_STORAGE_PROVIDER=r2,OBJECT_STORAGE_ENDPOINT=${R2_ENDPOINT},OBJECT_STORAGE_BUCKET=${R2_BUCKET}" \
            --set-secrets "DATABASE_URL=alsvid-database-url:latest,OBJECT_STORAGE_ACCESS_KEY=alsvid-development-r2-access-key:latest,OBJECT_STORAGE_SECRET_KEY=alsvid-development-r2-secret-key:latest" \
            --quiet

      - name: Smoke Development email registration, password setup and persistent session
        if: ${{ !inputs.publish_only }}
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          api_url="$(gcloud run services describe "$API_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          short_sha="${RELEASE_SHA:0:12}"
          email="auth-smoke-${short_sha}@development.alsvid.invalid"
          password='Development2026Smoke'
          start="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 -X POST "$api_url/api/v1/auth/email/start" -H 'content-type: application/json' --data "{\"email\":\"$email\"}")"
          code="$(printf '%s' "$start" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).data?.testCode||''))")"
          [[ "$code" =~ ^[0-9]{6}$ ]]
          complete="$(curl --fail --silent --show-error -X POST "$api_url/api/v1/auth/email/complete" -H 'content-type: application/json' --data "{\"email\":\"$email\",\"displayName\":\"Development Auth Smoke\",\"code\":\"$code\"}")"
          token="$(printf '%s' "$complete" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=JSON.parse(s).data; if(!d?.user?.roles?.includes('internal_user')||d?.user?.passwordSetupRequired!==true) process.exit(2); process.stdout.write(d.token||'')})")"
          [[ -n "$token" ]]

          me_before="$(curl --fail --silent --show-error "$api_url/api/v1/auth/me" -H "authorization: Bearer $token")"
          printf '%s' "$me_before" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{if(JSON.parse(s).data?.passwordSetupRequired!==true)process.exit(2)})"

          blocked_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$api_url/api/v1/auth/users" -H "authorization: Bearer $token")"
          [[ "$blocked_status" == '403' ]]

          curl --fail --silent --show-error -X POST "$api_url/api/v1/auth/password" -H 'content-type: application/json' -H "authorization: Bearer $token" --data "{\"password\":\"$password\"}" >/dev/null
          me_after="$(curl --fail --silent --show-error "$api_url/api/v1/auth/me" -H "authorization: Bearer $token")"
          printf '%s' "$me_after" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=JSON.parse(s).data;if(d?.passwordSetupRequired!==false||d?.passwordState!=='ACTIVE')process.exit(2)})"

          relogin="$(curl --fail --silent --show-error -X POST "$api_url/api/v1/auth/login" -H 'content-type: application/json' --data "{\"email\":\"$email\",\"password\":\"$password\"}")"
          printf '%s' "$relogin" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=JSON.parse(s).data;if(!d?.token||d?.user?.passwordSetupRequired!==false)process.exit(2)})"

      - name: Deploy Development web
        if: ${{ !inputs.publish_only }}
        env:
          REGISTRY: ${{ steps.release.outputs.registry }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          api_url="$(gcloud run services describe "$API_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          curl --fail --silent --show-error --retry 6 --retry-delay 5 "$api_url/api/health"
          gcloud run deploy "$WEB_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$REGISTRY/alsvid-dev-web:$RELEASE_SHA" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --port 3000 --cpu 1 --memory 512Mi --min 0 --max 2 \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=test,ALSVID_ENV=development,ALSVID_RELEASE_SHA=${RELEASE_SHA},ALSVID_COOKIE_SECURE=true,ALSVID_API_BASE_URL=${api_url}/api" \
            --quiet

      - name: Verify Development web
        if: ${{ !inputs.publish_only }}
        run: |
          set -euo pipefail
          web_url="$(gcloud run services describe "$WEB_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          curl --fail --silent --show-error --retry 6 --retry-delay 5 "$web_url" >/dev/null
          echo "Development web: $web_url"
