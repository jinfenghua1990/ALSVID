name: Deploy Development

on:
  workflow_dispatch:
    inputs:
      publish_only:
        description: 'Publish current tested revision without rebuilding API/web'
        required: false
        type: boolean
        default: false
  push:
    branches: [develop]

permissions:
  contents: read
  id-token: write

concurrency:
  group: alsvid-development-deploy
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
  API_SERVICE: alsvid-api-development
  WEB_SERVICE: alsvid-web-development
  R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
  R2_BUCKET: ${{ vars.R2_BUCKET }}
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/alsvid

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve release SHA
        id: release
        run: |
          set -euo pipefail
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Validate release and deployment variables
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          [[ -n "$GCP_PROJECT_ID" ]]
          [[ -n "$GCP_REGION" ]]
          [[ -n "$GCP_RUNTIME_SERVICE_ACCOUNT" ]]
          [[ -n "$R2_ENDPOINT" ]]
          [[ -n "$R2_BUCKET" ]]
          [[ -n "$RELEASE_SHA" ]]

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        if: ${{ !inputs.publish_only }}
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Install dependencies
        if: ${{ !inputs.publish_only }}
        run: pnpm install --frozen-lockfile

      - name: Build API image
        if: ${{ !inputs.publish_only }}
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          docker build -f apps/api/Dockerfile -t "$REGISTRY/alsvid-dev-api:$RELEASE_SHA" .
          docker push "$REGISTRY/alsvid-dev-api:$RELEASE_SHA"

      - name: Build web image
        if: ${{ !inputs.publish_only }}
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          docker build -f apps/web/Dockerfile -t "$REGISTRY/alsvid-dev-web:$RELEASE_SHA" .
          docker push "$REGISTRY/alsvid-dev-web:$RELEASE_SHA"

      - name: Run database migrations
        if: ${{ !inputs.publish_only }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm db:migrate

      - name: Deploy Development API
        if: ${{ !inputs.publish_only }}
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          gcloud run deploy "$API_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$REGISTRY/alsvid-dev-api:$RELEASE_SHA" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --port 4000 --cpu 1 --memory 512Mi --min 0 --max 2 \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=test,ALSVID_ENV=development,ALSVID_INTERNAL_EMAIL_DOMAINS=development.alsvid.invalid,ALSVID_INTERNAL_REGISTRATION_MODE=company_domain,ALSVID_INITIAL_ADMIN_EMAIL=jinfenghua1990@gmail.com,ALSVID_EMAIL_TEST_MODE=true,MAIL_PROVIDER=console,OBJECT_STORAGE_PROVIDER=r2,OBJECT_STORAGE_ENDPOINT=${R2_ENDPOINT},OBJECT_STORAGE_BUCKET=${R2_BUCKET}" \
            --set-secrets "DATABASE_URL=alsvid-database-url:latest,OBJECT_STORAGE_ACCESS_KEY=alsvid-development-r2-access-key:latest,OBJECT_STORAGE_SECRET_KEY=alsvid-development-r2-secret-key:latest" \
            --quiet

      - name: Smoke Development email registration, password setup and persistent session
        if: ${{ !inputs.publish_only }}
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          api_url="$(gcloud run services describe "$API_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          short_sha="${RELEASE_SHA:0:12}"
          email="auth-smoke-${short_sha}@development.alsvid.invalid"
          password="DevSmoke-$(openssl rand -hex 18)-Aa1!"
          start="$(curl --fail --silent --show-error --retry 6 --retry-delay 5 -X POST "$api_url/api/v1/auth/email/start" -H 'content-type: application/json' --data "{\"email\":\"$email\"}")"
          code="$(printf '%s' "$start" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).data?.testCode||''))")"
          [[ "$code" =~ ^[0-9]{6}$ ]]
          complete="$(curl --fail --silent --show-error -X POST "$api_url/api/v1/auth/email/complete" -H 'content-type: application/json' --data "{\"email\":\"$email\",\"displayName\":\"Development Auth Smoke\",\"code\":\"$code\"}")"
          token="$(printf '%s' "$complete" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=JSON.parse(s).data; if(!d?.user?.roles?.includes('internal_user')||d?.user?.passwordSetupRequired!==true) process.exit(2); process.stdout.write(d.token||'')})")"
          [[ -n "$token" ]]

          me_before="$(curl --fail --silent --show-error "$api_url/api/v1/auth/me" -H "authorization: Bearer $token")"
          printf '%s' "$me_before" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{if(JSON.parse(s).data?.passwordSetupRequired!==true)process.exit(2)})"

          blocked_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "$api_url/api/v1/auth/users" -H "authorization: Bearer $token")"
          [[ "$blocked_status" == '403' ]]

          curl --fail --silent --show-error -X POST "$api_url/api/v1/auth/password" -H 'content-type: application/json' -H "authorization: Bearer $token" --data "{\"password\":\"$password\"}" >/dev/null
          me_after="$(curl --fail --silent --show-error "$api_url/api/v1/auth/me" -H "authorization: Bearer $token")"
          printf '%s' "$me_after" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=JSON.parse(s).data;if(d?.passwordSetupRequired!==false||d?.passwordState!=='ACTIVE')process.exit(2)})"

          relogin="$(curl --fail --silent --show-error -X POST "$api_url/api/v1/auth/login" -H 'content-type: application/json' --data "{\"email\":\"$email\",\"password\":\"$password\"}")"
          printf '%s' "$relogin" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=JSON.parse(s).data;if(!d?.token||d?.user?.passwordSetupRequired!==false)process.exit(2)})"

      - name: Deploy Development web
        if: ${{ !inputs.publish_only }}
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          api_url="$(gcloud run services describe "$API_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          gcloud run deploy "$WEB_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "$REGISTRY/alsvid-dev-web:$RELEASE_SHA" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --port 3000 --cpu 1 --memory 512Mi --min 0 --max 2 \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production,ALSVID_ENV=development,API_BASE_URL=${api_url}" \
            --quiet

      - name: Publish Development images for current release
        if: ${{ inputs.publish_only }}
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          echo "publish_only selected for $RELEASE_SHA"
