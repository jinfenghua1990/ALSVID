name: FC1 browser preview
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'scripts/fc1-browser-review.mjs'
      - '.github/workflows/fc1-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fc1-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser_preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @alsvid/web build
      - name: Install temporary browser review tools
        run: |
          npm install --prefix "$RUNNER_TEMP/fc1-browser" playwright@1.58.2
          "$RUNNER_TEMP/fc1-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Preview and review the production build
        env:
          FC1_PLAYWRIGHT_ROOT: ${{ runner.temp }}/fc1-browser
          FC1_REVIEW_OUTPUT: .tmp/fc1-v4-review
          FC1_REVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          pnpm --filter @alsvid/web start > "$RUNNER_TEMP/fc1-next.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/en/explore/fc1 > /dev/null; then break; fi
            if [[ "$attempt" == "60" ]]; then cat "$RUNNER_TEMP/fc1-next.log"; exit 1; fi
            sleep 2
          done
          node scripts/fc1-browser-review.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fc1-v4-browser-review
          path: .tmp/fc1-v4-review
          retention-days: 30
          if-no-files-found: warn
