name: ALSVID Production Deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Target merged main commit (blank = current main; use an older SHA to roll back)"
        required: false
        type: string
      confirm:
        description: "Type deploy to confirm production deployment"
        required: true
        type: string
      rollback:
        description: "Allow deploying an older main commit (explicit rollback only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: alsvid-production-deploy
  cancel-in-progress: false

env:
  WEB_SERVICE: alsvid-web
  API_SERVICE: alsvid-api
  MIGRATION_JOB: alsvid-migrate

jobs:
  validate_dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release inputs before checkout
        env:
          RELEASE_SHA_INPUT: ${{ inputs.release_sha }}
          CONFIRM_INPUT: ${{ inputs.confirm }}
          ROLLBACK_INPUT: ${{ inputs.rollback }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CONFIRM_INPUT" != "deploy" ]]; then
            echo "::error title=Invalid confirmation::Set confirm to deploy." >&2
            exit 1
          fi
          if [[ -n "$RELEASE_SHA_INPUT" && ! "$RELEASE_SHA_INPUT" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo "::error title=Invalid release SHA::Leave release_sha blank for current main, or provide a full 40-character commit SHA. Do not enter deploy here." >&2
            exit 1
          fi
          if [[ "$ROLLBACK_INPUT" == "true" && -z "$RELEASE_SHA_INPUT" ]]; then
            echo "::error title=Missing rollback SHA::Explicit rollback requires a full 40-character release_sha." >&2
            exit 1
          fi

  change_scope:
    needs: validate_dispatch

    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          release_sha="${{ inputs.release_sha || github.sha }}"
          if ! git rev-parse "$release_sha^" >/dev/null 2>&1; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only=true
          while IFS= read -r file; do
            case "$file" in
              docs/*|*.md|AGENTS.md|.github/ISSUE_TEMPLATE/*) ;;
              *) docs_only=false; break ;;
            esac
          done < <(git diff --name-only "$release_sha^" "$release_sha")
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  deploy:
    needs: change_scope
    if: >-
      ${{
        needs.change_scope.result == 'success' &&
        github.event_name == 'workflow_dispatch' && inputs.confirm == 'deploy'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout release
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require verified CI or a previously released rollback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_PREVIOUS_PRODUCTION: true
          RELEASE_CONTROLLER_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          git show "$RELEASE_CONTROLLER_SHA:scripts/release-gate.mjs" | node --input-type=module - production

      - name: Validate release and deployment variables
        id: release
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          MAIL_PROVIDER: ${{ vars.MAIL_PROVIDER }}
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
          # Official confirmed FC1 reservations inbox; production override remains supported.
          NEXT_PUBLIC_FC1_RESERVATION_EMAIL: ${{ vars.NEXT_PUBLIC_FC1_RESERVATION_EMAIL || 'info@alsvidbike.com' }}
          AUTH_BASE_URL: https://admin.alsvidbike.com
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          for name in \
            GCP_PROJECT_ID GCP_REGION GAR_REPOSITORY \
            GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT \
            GCP_RUNTIME_SERVICE_ACCOUNT R2_ENDPOINT R2_BUCKET \
            MAIL_PROVIDER MAIL_FROM_ADDRESS; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub production variable: $name" >&2
              exit 1
            fi
          done

          if [[ "$MAIL_PROVIDER" != "resend" ]]; then
            echo "Production email verification requires MAIL_PROVIDER=resend; got: $MAIL_PROVIDER" >&2
            exit 1
          fi

          if [[ "$AUTH_BASE_URL" != "https://admin.alsvidbike.com" ]]; then
            echo "AUTH_BASE_URL must be https://admin.alsvidbike.com before the canonical-domain release" >&2
            exit 1
          fi

          if [[ ! "$MAIL_FROM_ADDRESS" =~ ^[^@[:space:]]+@[^@[:space:]]+$ ]]; then
            echo "MAIL_FROM_ADDRESS must be a valid email address" >&2
            exit 1
          fi

          # FC1 reservation email is required only when this release builds/publishes a Web
          # image; see "Require FC1 reservation email before Web build" after image lookup so
          # API-only releases are not blocked.

          git fetch origin main
          release_sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$release_sha" origin/main; then
            echo "Refusing deployment: $release_sha is not merged into main" >&2
            exit 1
          fi

          main_sha="$(git rev-parse origin/main)"
          if [[ "$RELEASE_EVENT" == "workflow_dispatch" && "${{ inputs.rollback }}" != "true" && "$release_sha" != "$main_sha" ]]; then
            echo "Refusing an outdated release; select the explicit rollback option to deploy an older main commit." >&2
            exit 1
          fi

          registry="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_EVENT" == "workflow_dispatch" && "$release_sha" != "$(git rev-parse origin/main)" ]]; then
            echo "rollback=true" >> "$GITHUB_OUTPUT"
          else
            echo "rollback=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight canonical domains before changing Production
        env:
          PUBLIC_SITE_URL: https://www.alsvidbike.com/zh/explore/fc1
          ADMIN_LOGIN_URL: https://admin.alsvidbike.com/login?portal=admin
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error --retry 2 --retry-delay 3 "$PUBLIC_SITE_URL" >/dev/null
          curl --location --fail --silent --show-error --retry 2 --retry-delay 3 "$ADMIN_LOGIN_URL" >/dev/null

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      # Runtime mail credentials should stay send-only. The domain read endpoint
      # requires a separate full-access Resend key, isolated to GitHub's production
      # environment and never injected into Cloud Run.
      - name: Verify configured Resend sender domain before changing Production
        env:
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
          RESEND_DOMAIN_AUDIT_API_KEY: ${{ secrets.RESEND_DOMAIN_AUDIT_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RESEND_DOMAIN_AUDIT_API_KEY:-}" ]]; then
            echo "::error title=Missing Resend domain audit credential::Add RESEND_DOMAIN_AUDIT_API_KEY as a GitHub production environment secret. It must be a Resend Full access key; keep the Cloud Run alsvidbike-mail-api-key send-only."
            exit 1
          fi

          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          http_code="$(curl --silent --show-error --retry 2 --retry-delay 3 \
            --output "$response_file" --write-out '%{http_code}' \
            -H "Authorization: Bearer $RESEND_DOMAIN_AUDIT_API_KEY" \
            https://api.resend.com/domains)"
          if [[ "$http_code" != "200" ]]; then
            if [[ "$http_code" == "401" || "$http_code" == "403" ]]; then
              echo "::error title=Resend domain audit credential rejected::The audit key must be active and have Full access to list domains. Do not elevate the application send-only key."
            else
              echo "::error title=Resend domain check failed::GET /domains returned HTTP $http_code. Production was not changed."
            fi
            exit 1
          fi

          node --input-type=module - "$response_file" <<'NODE'
          import fs from 'node:fs';
          const response = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const address = process.env.MAIL_FROM_ADDRESS ?? '';
          const match = address.match(/^[^@\s]+@([^@\s]+)$/);
          if (!match) {
            console.error('::error::MAIL_FROM_ADDRESS must be an email address.');
            process.exit(1);
          }
          const senderDomain = match[1].toLowerCase();
          const domains = response.data ?? response.domains ?? [];
          if (!Array.isArray(domains)) {
            console.error('::error::Resend /domains returned an unexpected response.');
            process.exit(1);
          }
          const domain = domains.find(item => item.name?.toLowerCase() === senderDomain);
          if (!domain || domain.status !== 'verified') {
            console.error(`::error title=Resend sender domain not verified::Verify DNS for ${senderDomain} in Resend before deploying. Current status: ${domain?.status ?? 'not found'}.`);
            process.exit(1);
          }
          console.log(`Verified Resend sender domain: ${senderDomain}`);
          NODE

      - name: Configure registry and reuse existing release images when available
        id: image_lookup
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          REGISTRY: ${{ steps.release.outputs.registry }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          IS_ROLLBACK: ${{ steps.release.outputs.rollback }}
          NEXT_PUBLIC_FC1_RESERVATION_EMAIL: ${{ vars.NEXT_PUBLIC_FC1_RESERVATION_EMAIL || 'info@alsvidbike.com' }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          # The WWW release pipeline (www-deploy.yml) publishes alsvid-web:<sha> from the
          # same Dockerfile and build args right after main CI succeeds. A pre-existing
          # web image for this exact commit is therefore reusable; the API image is
          # produced by this workflow when it is not already available.
          if [[ "$IS_ROLLBACK" == "true" ]]; then
            web_tag="$RELEASE_SHA"
          else
            reservation_email_hash="$(printf '%s' "$NEXT_PUBLIC_FC1_RESERVATION_EMAIL" | sha256sum | cut -c1-12)"
            web_tag="$RELEASE_SHA-reservation-$reservation_email_hash"
          fi
          web_exists=false
          api_exists=false
          if gcloud artifacts docker images describe "$REGISTRY/alsvid-web:$web_tag" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            web_exists=true
          fi
          if gcloud artifacts docker images describe "$REGISTRY/alsvid-api:$RELEASE_SHA" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            api_exists=true
          fi
          if [[ "$IS_ROLLBACK" == "true" && ( "$web_exists" != "true" || "$api_exists" != "true" ) ]]; then
            echo "Rollback requires all previously published release images; refusing to rebuild an older commit." >&2
            exit 1
          fi
          if [[ "$web_exists" == "true" && "$api_exists" == "true" ]]; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "web_exists=$web_exists"
            echo "web_tag=$web_tag"
            echo "api_exists=$api_exists"
          } >> "$GITHUB_OUTPUT"

      - name: Require FC1 reservation email before Web build
        if: steps.image_lookup.outputs.reused != 'true' && steps.image_lookup.outputs.web_exists != 'true'
        env:
          NEXT_PUBLIC_FC1_RESERVATION_EMAIL: ${{ vars.NEXT_PUBLIC_FC1_RESERVATION_EMAIL || 'info@alsvidbike.com' }}
        run: |
          set -euo pipefail
          if [[ ! "$NEXT_PUBLIC_FC1_RESERVATION_EMAIL" =~ ^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$ ]]; then
            echo "::error title=FC1 reservation email is not configured::Set and verify the official NEXT_PUBLIC_FC1_RESERVATION_EMAIL production variable before deploying a Web build." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build web image with cache
        if: steps.image_lookup.outputs.reused != 'true' && steps.image_lookup.outputs.web_exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.web
          platforms: linux/amd64
          load: true
          tags: |
            ${{ steps.release.outputs.registry }}/alsvid-web:${{ steps.image_lookup.outputs.web_tag }}
            ${{ steps.release.outputs.registry }}/alsvid-web:${{ steps.release.outputs.sha }}
          build-args: |
            ALSVID_ENV=production
            NEXT_PUBLIC_FC1_RESERVATION_EMAIL=${{ vars.NEXT_PUBLIC_FC1_RESERVATION_EMAIL || 'info@alsvidbike.com' }}
          cache-from: type=gha,scope=alsvid-production-web
          cache-to: type=gha,mode=max,scope=alsvid-production-web,ignore-error=true

      - name: Build api image with cache
        if: steps.image_lookup.outputs.reused != 'true' && steps.image_lookup.outputs.api_exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.api
          platforms: linux/amd64
          load: true
          tags: ${{ steps.release.outputs.registry }}/alsvid-api:${{ steps.release.outputs.sha }}
          cache-from: type=gha,scope=alsvid-production-api
          cache-to: type=gha,mode=max,scope=alsvid-production-api,ignore-error=true

      - name: Validate production mail secret exists
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          if ! gcloud secrets describe alsvidbike-mail-api-key --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            echo "Missing required Google Secret Manager secret: alsvidbike-mail-api-key" >&2
            exit 1
          fi

      - name: Push release images
        if: steps.image_lookup.outputs.reused != 'true'
        env:
          REGISTRY: ${{ steps.release.outputs.registry }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          WEB_TAG: ${{ steps.image_lookup.outputs.web_tag }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.image_lookup.outputs.web_exists }}" != "true" ]]; then
            # Mirror www-deploy.yml: publish both the reservation-hash tag and the plain SHA tag.
            docker push "$REGISTRY/alsvid-web:$WEB_TAG"
            if [[ "$WEB_TAG" != "$RELEASE_SHA" ]]; then
              docker push "$REGISTRY/alsvid-web:$RELEASE_SHA"
            fi
          else
            echo "Reusing alsvid-web:$WEB_TAG published by the WWW release pipeline."
          fi
          if [[ "${{ steps.image_lookup.outputs.api_exists }}" != "true" ]]; then
            docker push "$REGISTRY/alsvid-api:$RELEASE_SHA"
          fi

      - name: Resolve exact release image digests
        id: images
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGISTRY: ${{ steps.release.outputs.registry }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          WEB_TAG: ${{ steps.image_lookup.outputs.web_tag }}
        run: |
          set -euo pipefail
          web_digest="$(gcloud artifacts docker images describe "$REGISTRY/alsvid-web:$WEB_TAG" --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          if [[ ! "$web_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Could not resolve immutable digest for alsvid-web:$WEB_TAG" >&2
            exit 1
          fi
          echo "web_image=$REGISTRY/alsvid-web@$web_digest" >> "$GITHUB_OUTPUT"
          api_digest="$(gcloud artifacts docker images describe "$REGISTRY/alsvid-api:$RELEASE_SHA" --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          if [[ ! "$api_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Could not resolve immutable digest for alsvid-api:$RELEASE_SHA" >&2
            exit 1
          fi
          echo "api_image=$REGISTRY/alsvid-api@$api_digest" >> "$GITHUB_OUTPUT"

      - name: Run database migrations as an explicit release job
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          REGISTRY: ${{ steps.release.outputs.registry }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$MIGRATION_JOB" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "${{ steps.images.outputs.api_image }}" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --command node \
            --args node_modules/@alsvid/database/dist/migrate.js \
            --set-env-vars NODE_ENV=production \
            --set-secrets DATABASE_URL=alsvid-database-url:latest \
            --max-retries 1 \
            --task-timeout 10m \
            --quiet
          gcloud run jobs execute "$MIGRATION_JOB" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --wait \
            --quiet

      - name: Deploy API service
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          REGISTRY: ${{ steps.release.outputs.registry }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          ALSVID_INTERNAL_EMAIL_DOMAINS: ${{ vars.ALSVID_INTERNAL_EMAIL_DOMAINS }}
          ALSVID_INTERNAL_REGISTRATION_MODE: ${{ vars.ALSVID_INTERNAL_REGISTRATION_MODE }}
          ALSVID_INITIAL_ADMIN_EMAIL: ${{ vars.ALSVID_INITIAL_ADMIN_EMAIL }}
          MAIL_PROVIDER: ${{ vars.MAIL_PROVIDER }}
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
          NEXT_PUBLIC_FC1_RESERVATION_EMAIL: ${{ vars.NEXT_PUBLIC_FC1_RESERVATION_EMAIL || 'info@alsvidbike.com' }}
          AUTH_BASE_URL: https://admin.alsvidbike.com
        run: |
          set -euo pipefail
          env_vars="NODE_ENV=production,ALSVID_ENV=production,ALSVID_RELEASE_SHA=$RELEASE_SHA,ALSVID_EMAIL_TEST_MODE=false,OBJECT_STORAGE_PROVIDER=r2,OBJECT_STORAGE_ENDPOINT=$R2_ENDPOINT,OBJECT_STORAGE_BUCKET=$R2_BUCKET,ALSVID_INTERNAL_EMAIL_DOMAINS=${ALSVID_INTERNAL_EMAIL_DOMAINS:-},ALSVID_INTERNAL_REGISTRATION_MODE=${ALSVID_INTERNAL_REGISTRATION_MODE:-company_domain},ALSVID_INITIAL_ADMIN_EMAIL=${ALSVID_INITIAL_ADMIN_EMAIL:-},MAIL_PROVIDER=${MAIL_PROVIDER:-resend},MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-noreply@alsvidbike.com},MAIL_FROM_NAME=ALSVID,FC1_RESERVATION_EMAIL=${NEXT_PUBLIC_FC1_RESERVATION_EMAIL:-},AUTH_BASE_URL=$AUTH_BASE_URL,ALSVID_ADMIN_PASSWORD_LOGIN_ENABLED=true,ALSVID_DEALER_PASSWORD_LOGIN_ENABLED=true,ALSVID_SUPPLIER_PASSWORD_LOGIN_ENABLED=true"
          secret_bindings="DATABASE_URL=alsvid-database-url:latest,OBJECT_STORAGE_ACCESS_KEY=alsvid-r2-access-key:latest,OBJECT_STORAGE_SECRET_KEY=alsvid-r2-secret-key:latest,MAIL_API_KEY=alsvidbike-mail-api-key:latest"

          gcloud run deploy "$API_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "${{ steps.images.outputs.api_image }}" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --port 4000 \
            --cpu 1 \
            --memory 512Mi \
            --min 0 \
            --max 3 \
            --allow-unauthenticated \
            --set-env-vars "$env_vars" \
            --set-secrets "$secret_bindings" \
            --quiet

      - name: Resolve API URL and verify health
        id: api
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          api_url="$(gcloud run services describe "$API_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          curl --fail --silent --show-error --retry 6 --retry-delay 5 "$api_url/api/health"
          echo "url=$api_url" >> "$GITHUB_OUTPUT"

      - name: Verify public Dealer API after database and API rollout
        if: ${{ steps.release.outputs.rollback != 'true' }}
        env:
          ALSVID_API_URL: ${{ steps.api.outputs.url }}
        run: node scripts/check-dealer-api-readiness.mjs

      - name: Verify production mail configuration on the deployed revision
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
        run: |
          set -euo pipefail
          service_json="$(gcloud run services describe "$API_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json)"
          env_value() {
            echo "$service_json" | jq -r --arg name "$1" \
              '.spec.template.spec.containers[0].env[] | select(.name == $name) | (.value // .valueFrom.secretKeyRef.name // "")'
          }
          binding="$(env_value MAIL_API_KEY)"
          from="$(env_value MAIL_FROM_ADDRESS)"
          test_mode="$(env_value ALSVID_EMAIL_TEST_MODE)"
          if [[ "$binding" != "alsvidbike-mail-api-key" ]]; then
            echo "::error title=Mail secret binding mismatch::MAIL_API_KEY must reference alsvidbike-mail-api-key; got: ${binding:-none}" >&2
            exit 1
          fi
          if [[ "$from" != "$MAIL_FROM_ADDRESS" ]]; then
            echo "::error title=Mail sender mismatch::MAIL_FROM_ADDRESS on the service ($from) does not match the production variable ($MAIL_FROM_ADDRESS)" >&2
            exit 1
          fi
          if [[ "$test_mode" != "false" ]]; then
            echo "::error title=Email test mode must stay off::ALSVID_EMAIL_TEST_MODE is '$test_mode'; production requires 'false'" >&2
            exit 1
          fi
          echo "Production mail configuration verified: secret=$binding from=$from test_mode=$test_mode"

      - name: Deploy Web service
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          REGISTRY: ${{ steps.release.outputs.registry }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          API_URL: ${{ steps.api.outputs.url }}
          AUTH_BASE_URL: https://admin.alsvidbike.com
        run: |
          set -euo pipefail
          gcloud run deploy "$WEB_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --no-default-url \
            --image "${{ steps.images.outputs.web_image }}" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --port 3000 \
            --cpu 1 \
            --memory 512Mi \
            --min 0 \
            --max 3 \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production,ALSVID_ENV=production,ALSVID_RELEASE_SHA=${RELEASE_SHA},ALSVID_API_BASE_URL=${API_URL}/api,AUTH_BASE_URL=${AUTH_BASE_URL},ALSVID_ADMIN_PASSWORD_LOGIN_ENABLED=true,ALSVID_DEALER_PASSWORD_LOGIN_ENABLED=true,ALSVID_SUPPLIER_PASSWORD_LOGIN_ENABLED=true" \
            --quiet

      - name: Verify public website and admin, record deployed release
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          PUBLIC_SITE_URL: https://www.alsvidbike.com/zh/explore/fc1
          AUTH_BASE_URL: https://admin.alsvidbike.com
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error --retry 6 --retry-delay 5 "$PUBLIC_SITE_URL" >/dev/null
          curl --location --fail --silent --show-error --retry 6 --retry-delay 5 "$AUTH_BASE_URL" >/dev/null
          # Ensure the public hostname is serving this exact Web image after the full rollout.
          release_json="$(curl --location --fail --silent --show-error --retry 6 --retry-delay 5 "https://www.alsvidbike.com/release-check")"
          printf '%s' "$release_json" | node -e '
            let body = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", chunk => body += chunk);
            process.stdin.on("end", () => {
              const payload = JSON.parse(body);
              if (payload.service !== "alsvid-web" || payload.release !== process.argv[1]) {
                console.error("The public WWW hostname is not serving the expected Web release SHA.");
                process.exitCode = 1;
              }
            });
          ' "$RELEASE_SHA"
          # Full deployments must enforce the same public catalog checks as WWW-only releases.
          for locale in zh de en; do
            for section in bikes accessories; do
              url="https://www.alsvidbike.com/$locale/$section"
              case "$section" in
                bikes) marker='data-bikes-catalog="1"' ;;
                accessories) marker='data-accessories-catalog="1"' ;;
              esac
              html="$(curl --location --fail --silent --show-error --retry 5 --retry-delay 3 --max-time 35 "$url")"
              if ! grep -Fq "$marker" <<< "$html"; then
                echo "::error title=Public catalog smoke failed::Missing $marker at $url" >&2
                exit 1
              fi
              echo "Verified public catalog: $url" >> "$GITHUB_STEP_SUMMARY"
            done
          done
          admin_login_url="$AUTH_BASE_URL/zh/login?portal=admin"
          admin_login_html="$(curl --location --fail --silent --show-error --retry 6 --retry-delay 5 "$admin_login_url")"
          for marker in '邮箱验证码' '账户密码' 'name="password"'; do
            if ! grep -Fq "$marker" <<< "$admin_login_html"; then
              echo "::error title=Admin login mode verification failed::Expected marker '$marker' missing from $admin_login_url" >&2
              exit 1
            fi
          done
          echo "Admin login exposes email-code and password methods: $admin_login_url"
          {
            echo "### ALSVID production deployment"
            echo "- Release: $RELEASE_SHA"
            echo "- Public site: $PUBLIC_SITE_URL"
            echo "- Admin: $AUTH_BASE_URL"
            echo "- Email verification: resend"
          } >> "$GITHUB_STEP_SUMMARY"
