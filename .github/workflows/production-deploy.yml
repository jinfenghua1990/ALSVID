name: ALSVID Production Deploy

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: "Target merged main commit (blank = current main; use an older SHA to roll back)"
        required: false
        type: string
      confirm:
        description: "Type deploy to confirm production deployment"
        required: true
        type: string
      rollback:
        description: "Allow deploying an older main commit (explicit rollback only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: alsvid-production-deploy
  cancel-in-progress: false

env:
  WEB_SERVICE: alsvid-web
  API_SERVICE: alsvid-api
  WORKER_POOL: alsvid-worker
  WORKER_INSTANCES: ${{ vars.WORKER_INSTANCES || '0' }}
  MIGRATION_JOB: alsvid-migrate

jobs:
  change_scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0
      - name: Classify changed paths
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          release_sha="${{ inputs.release_sha || github.sha }}"
          if ! git rev-parse "$release_sha^" >/dev/null 2>&1; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only=true
          while IFS= read -r file; do
            case "$file" in
              docs/*|*.md|AGENTS.md|.github/ISSUE_TEMPLATE/*) ;;
              *) docs_only=false; break ;;
            esac
          done < <(git diff --name-only "$release_sha^" "$release_sha")
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  deploy:
    needs: change_scope
    if: >-
      ${{
        needs.change_scope.result == 'success' &&
        github.event_name == 'workflow_dispatch' && inputs.confirm == 'deploy'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout release
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Require verified CI or a previously released rollback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_PREVIOUS_PRODUCTION: true
          RELEASE_CONTROLLER_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          git show "$RELEASE_CONTROLLER_SHA:scripts/release-gate.mjs" | node --input-type=module - production

      - name: Validate release and deployment variables
        id: release
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          MAIL_PROVIDER: ${{ vars.MAIL_PROVIDER }}
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
          AUTH_BASE_URL: ${{ vars.AUTH_BASE_URL }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          for name in \
            GCP_PROJECT_ID GCP_REGION GAR_REPOSITORY \
            GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT \
            GCP_RUNTIME_SERVICE_ACCOUNT R2_ENDPOINT R2_BUCKET \
            MAIL_PROVIDER MAIL_FROM_ADDRESS AUTH_BASE_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub production variable: $name" >&2
              exit 1
            fi
          done

          if [[ "$MAIL_PROVIDER" != "resend" ]]; then
            echo "Production email verification requires MAIL_PROVIDER=resend; got: $MAIL_PROVIDER" >&2
            exit 1
          fi

          if [[ "$AUTH_BASE_URL" != https://* || "$AUTH_BASE_URL" == *run.app* ]]; then
            echo "AUTH_BASE_URL must be an HTTPS canonical domain and must not be a run.app URL" >&2
            exit 1
          fi

          git fetch origin main
          release_sha="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$release_sha" origin/main; then
            echo "Refusing deployment: $release_sha is not merged into main" >&2
            exit 1
          fi

          main_sha="$(git rev-parse origin/main)"
          if [[ "$RELEASE_EVENT" == "workflow_dispatch" && "${{ inputs.rollback }}" != "true" && "$release_sha" != "$main_sha" ]]; then
            echo "Refusing an outdated release; select the explicit rollback option to deploy an older main commit." >&2
            exit 1
          fi

          registry="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GAR_REPOSITORY}"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_EVENT" == "workflow_dispatch" && "$release_sha" != "$(git rev-parse origin/main)" ]]; then
            echo "rollback=true" >> "$GITHUB_OUTPUT"
          else
            echo "rollback=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure registry and reuse existing release images when available
        id: image_lookup
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          REGISTRY: ${{ steps.release.outputs.registry }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          IS_ROLLBACK: ${{ steps.release.outputs.rollback }}
        run: |
          set -euo pipefail
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          images=(alsvid-web alsvid-api alsvid-worker)
          found=0
          for image in "${images[@]}"; do
            if gcloud artifacts docker images describe "$REGISTRY/$image:$RELEASE_SHA" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
              found=$((found + 1))
            fi
          done
          if [[ "$IS_ROLLBACK" == "true" && "$found" != "${#images[@]}" ]]; then
            echo "Rollback requires all previously published release images; refusing to rebuild an older commit." >&2
            exit 1
          fi
          if [[ "$found" == "${#images[@]}" ]]; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
          elif [[ "$found" == "0" ]]; then
            echo "reused=false" >> "$GITHUB_OUTPUT"
          else
            echo "Only some release images exist; refusing to mix builds and historical images." >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build web image with cache
        if: steps.image_lookup.outputs.reused != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.web
          platforms: linux/amd64
          load: true
          tags: ${{ steps.release.outputs.registry }}/alsvid-web:${{ steps.release.outputs.sha }}
          build-args: ALSVID_ENV=production
          cache-from: type=gha,scope=alsvid-production-web
          cache-to: type=gha,mode=max,scope=alsvid-production-web,ignore-error=true

      - name: Build api image with cache
        if: steps.image_lookup.outputs.reused != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.api
          platforms: linux/amd64
          load: true
          tags: ${{ steps.release.outputs.registry }}/alsvid-api:${{ steps.release.outputs.sha }}
          cache-from: type=gha,scope=alsvid-production-api
          cache-to: type=gha,mode=max,scope=alsvid-production-api,ignore-error=true

      - name: Build worker image with cache
        if: steps.image_lookup.outputs.reused != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/Dockerfile.worker
          platforms: linux/amd64
          load: true
          tags: ${{ steps.release.outputs.registry }}/alsvid-worker:${{ steps.release.outputs.sha }}
          cache-from: type=gha,scope=alsvid-production-worker
          cache-to: type=gha,mode=max,scope=alsvid-production-worker,ignore-error=true

      - name: Validate production mail secret exists
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          if ! gcloud secrets describe alsvid-mail-api-key --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            echo "Missing required Google Secret Manager secret: alsvid-mail-api-key" >&2
            exit 1
          fi

      - name: Push release images
        if: steps.image_lookup.outputs.reused != 'true'
        env:
          REGISTRY: ${{ steps.release.outputs.registry }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          docker push "$REGISTRY/alsvid-web:$RELEASE_SHA"
          docker push "$REGISTRY/alsvid-api:$RELEASE_SHA"
          docker push "$REGISTRY/alsvid-worker:$RELEASE_SHA"

      - name: Resolve exact release image digests
        id: images
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGISTRY: ${{ steps.release.outputs.registry }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          for image in web api worker; do
            digest="$(gcloud artifacts docker images describe "$REGISTRY/alsvid-$image:$RELEASE_SHA" --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
            if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
              echo "Could not resolve immutable digest for alsvid-$image:$RELEASE_SHA" >&2
              exit 1
            fi
            echo "${image}_image=$REGISTRY/alsvid-$image@$digest" >> "$GITHUB_OUTPUT"
          done

      - name: Run database migrations as an explicit release job
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          REGISTRY: ${{ steps.release.outputs.registry }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          gcloud run jobs deploy "$MIGRATION_JOB" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "${{ steps.images.outputs.api_image }}" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --command node \
            --args node_modules/@alsvid/database/dist/migrate.js \
            --set-env-vars NODE_ENV=production \
            --set-secrets DATABASE_URL=alsvid-database-url:latest \
            --max-retries 1 \
            --task-timeout 10m \
            --quiet
          gcloud run jobs execute "$MIGRATION_JOB" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --wait \
            --quiet

      - name: Deploy API service
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          REGISTRY: ${{ steps.release.outputs.registry }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          ALSVID_INTERNAL_EMAIL_DOMAINS: ${{ vars.ALSVID_INTERNAL_EMAIL_DOMAINS }}
          ALSVID_INTERNAL_REGISTRATION_MODE: ${{ vars.ALSVID_INTERNAL_REGISTRATION_MODE }}
          ALSVID_INITIAL_ADMIN_EMAIL: ${{ vars.ALSVID_INITIAL_ADMIN_EMAIL }}
          MAIL_PROVIDER: ${{ vars.MAIL_PROVIDER }}
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
          AUTH_BASE_URL: ${{ vars.AUTH_BASE_URL }}
        run: |
          set -euo pipefail
          env_vars="NODE_ENV=production,ALSVID_ENV=production,ALSVID_RELEASE_SHA=$RELEASE_SHA,ALSVID_EMAIL_TEST_MODE=false,OBJECT_STORAGE_PROVIDER=r2,OBJECT_STORAGE_ENDPOINT=$R2_ENDPOINT,OBJECT_STORAGE_BUCKET=$R2_BUCKET,ALSVID_INTERNAL_EMAIL_DOMAINS=${ALSVID_INTERNAL_EMAIL_DOMAINS:-},ALSVID_INTERNAL_REGISTRATION_MODE=${ALSVID_INTERNAL_REGISTRATION_MODE:-company_domain},ALSVID_INITIAL_ADMIN_EMAIL=${ALSVID_INITIAL_ADMIN_EMAIL:-},MAIL_PROVIDER=${MAIL_PROVIDER:-resend},MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-noreply@chaibenn.com},MAIL_FROM_NAME=ALSVID,AUTH_BASE_URL=$AUTH_BASE_URL"
          secret_bindings="DATABASE_URL=alsvid-database-url:latest,OBJECT_STORAGE_ACCESS_KEY=alsvid-r2-access-key:latest,OBJECT_STORAGE_SECRET_KEY=alsvid-r2-secret-key:latest,MAIL_API_KEY=alsvid-mail-api-key:latest"

          gcloud run deploy "$API_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "${{ steps.images.outputs.api_image }}" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --port 4000 \
            --cpu 1 \
            --memory 512Mi \
            --min 0 \
            --max 3 \
            --allow-unauthenticated \
            --set-env-vars "$env_vars" \
            --set-secrets "$secret_bindings" \
            --quiet

      - name: Deploy worker pool with zero idle instances by default
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          REGISTRY: ${{ steps.release.outputs.registry }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          gcloud run worker-pools deploy "$WORKER_POOL" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "${{ steps.images.outputs.worker_image }}" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --instances "$WORKER_INSTANCES" \
            --cpu 1 \
            --memory 512Mi \
            --set-env-vars "NODE_ENV=production,OBJECT_STORAGE_PROVIDER=r2,OBJECT_STORAGE_ENDPOINT=$R2_ENDPOINT,OBJECT_STORAGE_BUCKET=$R2_BUCKET,WORKER_QUEUE=default,WORKER_POLL_MS=1000,WORKER_LEASE_MS=300000" \
            --set-secrets "DATABASE_URL=alsvid-database-url:latest,OBJECT_STORAGE_ACCESS_KEY=alsvid-r2-access-key:latest,OBJECT_STORAGE_SECRET_KEY=alsvid-r2-secret-key:latest" \
            --quiet

      - name: Resolve API URL and verify health
        id: api
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          api_url="$(gcloud run services describe "$API_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          curl --fail --silent --show-error --retry 6 --retry-delay 5 "$api_url/api/health"
          echo "url=$api_url" >> "$GITHUB_OUTPUT"

      - name: Deploy Web service
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          REGISTRY: ${{ steps.release.outputs.registry }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          API_URL: ${{ steps.api.outputs.url }}
          AUTH_BASE_URL: ${{ vars.AUTH_BASE_URL }}
        run: |
          set -euo pipefail
          gcloud run deploy "$WEB_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --no-default-url \
            --image "${{ steps.images.outputs.web_image }}" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --port 3000 \
            --cpu 1 \
            --memory 512Mi \
            --min 0 \
            --max 3 \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production,ALSVID_ENV=production,ALSVID_RELEASE_SHA=${RELEASE_SHA},ALSVID_API_BASE_URL=${API_URL}/api,AUTH_BASE_URL=${AUTH_BASE_URL}" \
            --quiet

      - name: Verify public website and admin, record deployed release
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          PUBLIC_SITE_URL: https://www.alsvid.com/zh/explore/fc1
          AUTH_BASE_URL: ${{ vars.AUTH_BASE_URL }}
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error --retry 6 --retry-delay 5 "$PUBLIC_SITE_URL" >/dev/null
          curl --location --fail --silent --show-error --retry 6 --retry-delay 5 "$AUTH_BASE_URL" >/dev/null
          {
            echo "### ALSVID production deployment"
            echo "- Release: $RELEASE_SHA"
            echo "- Public site: $PUBLIC_SITE_URL"
            echo "- Admin: $AUTH_BASE_URL"
            echo "- Worker pool: $WORKER_POOL (instances: $WORKER_INSTANCES)"
            echo "- Email verification: resend"
          } >> "$GITHUB_STEP_SUMMARY"
