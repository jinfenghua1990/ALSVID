steps:
  - name: 'node:22-bookworm'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        corepack enable
        pnpm install --frozen-lockfile
        pnpm verify

options:
  logging: CLOUD_LOGGING_ONLY

