services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
    environment:
      NODE_ENV: test
      ALSVID_API_BASE_URL: http://api:4000/api
      OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-unconfigured}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      NODE_ENV: test
      DATABASE_URL: ${DATABASE_URL:-postgresql://alsvid_test:alsvid_test@postgres:5432/alsvid_test}
      ALSVID_MIN_PASSWORD_LENGTH: ${ALSVID_MIN_PASSWORD_LENGTH:-4}
      OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-unconfigured}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      NODE_ENV: test
      DATABASE_URL: ${DATABASE_URL:-postgresql://alsvid_test:alsvid_test@postgres:5432/alsvid_test}
      OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-unconfigured}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: alsvid_test
      POSTGRES_USER: alsvid_test
      POSTGRES_PASSWORD: alsvid_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alsvid_test -d alsvid_test"]
      interval: 5s
      timeout: 5s
      retries: 10
