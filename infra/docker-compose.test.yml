services:
  web:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
    environment:
      NODE_ENV: test
      ALSVID_API_BASE_URL: http://api:4000
    ports:
      - "3001:3000"
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://alsvid_test:alsvid_test@postgres:5432/alsvid_test
      OBJECT_STORAGE_PROVIDER: unconfigured
    ports:
      - "4001:4000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://alsvid_test:alsvid_test@postgres:5432/alsvid_test
      OBJECT_STORAGE_PROVIDER: unconfigured
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: alsvid_test
      POSTGRES_USER: alsvid_test
      POSTGRES_PASSWORD: alsvid_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alsvid_test -d alsvid_test"]
      interval: 5s
      timeout: 5s
      retries: 10
