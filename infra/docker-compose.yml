services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: alsvid
      POSTGRES_USER: alsvid
      POSTGRES_PASSWORD: alsvid
    ports:
      - "5432:5432"
    volumes:
      - alsvid_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alsvid -d alsvid"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: alsvid
      MINIO_ROOT_PASSWORD: alsvid-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - alsvid_minio:/data

volumes:
  alsvid_postgres:
  alsvid_minio:
