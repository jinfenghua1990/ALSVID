ServerName localhost
ServerTokens Prod
ServerSignature Off
<VirtualHost *:8080>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <LocationMatch "^/install(?:/|$)">
        Require all denied
    </LocationMatch>
    # Candidate service: disable consumer mutations until separate acceptance.
    <LocationMatch "^/api/">
        <LimitExcept GET HEAD OPTIONS>
            Require all denied
        </LimitExcept>
    </LocationMatch>
    <LocationMatch "^/api/(?:crontab|pay|transfer|wechat|sms)(?:/|$)">
        Require all denied
    </LocationMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
