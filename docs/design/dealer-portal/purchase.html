<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>采购中心 · ALSVID Dealer Portal</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/components.css">
<link rel="stylesheet" href="assets/layout.css">
</head>
<body>

<div class="app">
  <div data-shell-header></div>

  <main class="page">
    <div class="shell">

      <div class="page-head">
        <div class="page-title-group">
          <nav class="breadcrumb">
            <a href="index.html">工作台</a><span class="sep">/</span><span>采购中心</span>
          </nav>
          <h1 class="t-h1">采购中心</h1>
          <p class="t-sm">提交 B2B 采购需求，ALSVID 确认后自动转为正式订单。</p>
        </div>
        <div class="page-actions">
          <a class="btn btn-secondary" href="catalog.html">浏览产品目录</a>
          <a class="btn btn-primary" href="#create">新建采购申请</a>
        </div>
      </div>

      <!-- ============ 新建采购申请 ============ -->
      <section id="create" class="section" style="margin-top:0">
        <div class="section-head">
          <h2 class="t-h2">新建采购申请</h2>
        </div>
        <div class="split">
          <form class="card card-pad" onsubmit="return false">
            <p class="t-xs t-muted" style="margin-bottom:20px">
              选择产品 → 选择数量 → 选择配置 → 提交请求 → ALSVID 确认 → 生成订单
            </p>
            <div class="grid g-2">
              <div class="field">
                <label class="label" for="p-model">产品型号</label>
                <select class="select" id="p-model">
                  <option>FC1 Pro</option>
                  <option>FC1</option>
                  <option>CT2</option>
                  <option>FT3</option>
                  <option>GT1 Pro</option>
                </select>
              </div>
              <div class="field">
                <label class="label" for="p-color">配色</label>
                <select class="select" id="p-color">
                  <option>Black</option>
                  <option>White</option>
                  <option>Slate</option>
                </select>
              </div>
              <div class="field">
                <label class="label" for="p-qty">数量</label>
                <input class="input" id="p-qty" type="number" min="1" value="20">
              </div>
              <div class="field">
                <label class="label" for="p-size">车架尺寸</label>
                <select class="select" id="p-size">
                  <option>S / M / L 混配</option>
                  <option>S</option>
                  <option>M</option>
                  <option>L</option>
                </select>
              </div>
            </div>
            <div class="field" style="margin-top:16px">
              <label class="label" for="p-note">备注（选填）</label>
              <textarea class="textarea" id="p-note" placeholder="交付地点、到货时间要求等"></textarea>
            </div>
            <div class="row-between" style="margin-top:20px">
              <span class="api-note">POST /api/dealer/purchase-requests</span>
              <div class="row" style="gap:10px">
                <button class="btn btn-secondary">存为草稿</button>
                <button class="btn btn-primary" disabled title="待接入 ALSVID API">提交申请</button>
              </div>
            </div>
          </form>

          <aside>
            <div class="card card-pad-sm">
              <p class="t-sm t-strong" style="margin-bottom:8px">提交后会发生什么</p>
              <p class="t-sm">ALSVID 区域经理确认配置与交期，通常 2 个工作日内回复，结果在消息中心通知。</p>
              <p class="t-xs t-muted" style="margin-top:10px">表单结构已对齐 API 契约，接入后即可启用提交。</p>
            </div>
          </aside>
        </div>
      </section>

      <!-- ============ 采购申请列表 ============ -->
      <section class="section">
        <div class="section-head">
          <h2 class="t-h2">采购申请列表</h2>
          <span class="t-xs t-muted">仅显示当前经销商账户提交的记录</span>
        </div>

        <div class="filterbar" data-filter-group="#prTable">
          <button class="chip" data-filter="all" aria-selected="true">全部</button>
          <button class="chip" data-filter="Draft">Draft</button>
          <button class="chip" data-filter="Submitted">Submitted</button>
          <button class="chip" data-filter="Confirmed">Confirmed</button>
          <button class="chip" data-filter="Completed">Completed</button>
        </div>

        <div class="tbl-wrap" id="prTable">
          <div class="tbl-scroll">
            <table class="tbl">
              <thead>
                <tr>
                  <th>申请编号</th><th>内容</th><th class="col-right">数量</th>
                  <th class="col-right">金额</th><th>状态</th><th>提交日期</th><th></th>
                </tr>
              </thead>
              <tbody data-list="purchaseRequests" data-empty="暂无采购申请" data-api="GET /api/dealer/purchase-requests"></tbody>
            </table>
          </div>
        </div>
      </section>

    </div>
  </main>

  <div data-shell-footer></div>
</div>

<div class="drawer-scrim" id="drawerScrim"></div>
<div data-shell-drawer></div>

<script src="assets/demo-data.js"></script>
<script src="assets/app.js"></script>
<script>ALSVID.initShell('purchase');</script>
</body>
</html>
